services:
  delivery-db:
    image: postgres:18
    container_name: delivery-db
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery1234
      POSTGRES_DB: delivery
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - delivery-db-data:/var/lib/postgresql   # PostgreSQL 18부터는 이 경로

volumes:
  delivery-db-data: